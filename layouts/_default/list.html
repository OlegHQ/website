{{ define "main" }}
<div class="sheet" data-root data-home="writings" style="position: relative; background: #e9e8e3; overflow-x: clip">
{{ partial "sheet/topbar.html" (dict "cur" "writings" "no" "3" "contact" true) }}
<div style="max-width: 1360px; margin: 0 auto; box-sizing: border-box; padding: 52px clamp(16px, 3vw, 40px) 0">
<h1 class="sp b" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">{{ .Title }}</h1>
<section id="writings" data-sec="writings" style="scroll-margin-top: 49px; padding-bottom: 150px">
{{ partial "sheet/writings-opener.html" . }}
{{ partial "sheet/writings.html" . }}
</section>
<section id="contact" data-sec="contact" style="scroll-margin-top: 49px; padding-bottom: 120px">
{{ partial "sheet/contact.html" . }}
</section>
{{ partial "sheet/footer.html" . }}
</div>
<canvas data-wipe aria-hidden="true" width="1" height="1" style="position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none"></canvas>
</div>
{{ end }}
