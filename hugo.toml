baseURL = 'https://olegpustovit.com/'
languageCode = 'en-us'
title = 'Oleg Pustovit'
copyright = "Oleg Pustovit"
disableKinds = ['taxonomy', 'term']
enableRobotsTXT = true

[services]
  [services.googleAnalytics]
    id = 'G-82NPJKSTQK'

[markup]
[markup.highlight]
noClasses = false
[markup.goldmark.renderer]
unsafe = true
style = 'catppuccin-latte'
lineNos = true
[markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true


[params]
rss = true
author = "Oleg Pustovit"
title = "Oleg Pustovit"
description = "Oleg Pustovit builds products with early-stage startups, and his own tools in the open. Projects, experiments and writing."

[params.forms.newsletter]
action = "https://olegpustovit.substack.com/api/v1/free?nojs=true"
formId = "7961988"
uid = "842da55da6"
format = "inline"
version = "5"

# Microblog notes exported from Poster are not part of the sheet.
[[cascade]]
  [cascade.build]
    render = 'never'
    list = 'never'
  [cascade._target]
    path = '{/status,/status/**}'
