baseURL = 'https://olegpustovit.com/'
languageCode = 'en-us'
title = 'Oleg Pustovit'
copyright = "Oleg Pustovit"
disableKinds = ['taxonomy', 'term']

[services]
  [services.googleAnalytics]
    id = 'G-82NPJKSTQK'

[markup]
[markup.highlight]
noClasses = false
[markup.goldmark.renderer]
unsafe = true
style = 'catppuccin-latte'
lineNos = true
[markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true


[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = 'css'
[[build.cachebusters]]
source = '(postcss|tailwind)\.config\.js'
target = 'css'
[module]
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'


[params]
rss = true
author = "Oleg Pustovit"
title = "Oleg Pustovit"
description = "Oleg Pustovit builds products with early-stage startups, and his own tools in the open. Projects, experiments and writing."

[params.forms.newsletter]
action = "https://olegpustovit.substack.com/api/v1/free?nojs=true"
formId = "7961988"
uid = "842da55da6"
format = "inline"
version = "5"
